# Codex CLI MCP 配置片段——chrome-devtools（项目 vendor 内置版）
# 用法：并入副本的 ~/.codex/config.toml（Codex 的 MCP 配置在用户级）。
# 路径说明：相对路径在「本副本根启动 codex」时成立；全局配置请把 args[0] 换成
# 本副本内的绝对路径（每个项目副本各自一份 vendor，勿跨副本引用）。

[mcp_servers.chrome-devtools]
command = "node"
args = ["tools/mcp/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js", "--channel=stable"]
