name: vendored-check

# 周度技能升级检查：update-vendored check 跑在 GitHub 干净网络（git SHA + npm 版本双通道）。
# 报告落 Issue 并 @ 维护者；push 触发只做冒烟（验证工作流健康），不落 Issue 防刷屏。
on:
  schedule: [{ cron: "23 3 * * 1" }]
  workflow_dispatch:
  push: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 运行升级检查
        id: check
        run: |
          set +e
          node scripts/update-vendored.mjs check > report.txt
          EXIT=$?
          cat report.txt
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
      - name: 打包离线升级包（仅有可升级项）
        if: steps.check.outputs.exit == '1'
        run: node scripts/update-vendored.mjs --pack bundle
      - name: 上传离线升级包
        if: steps.check.outputs.exit == '1'
        uses: actions/upload-artifact@v4
        with:
          name: vendored-bundle-${{ github.run_number }}
          path: bundle
          retention-days: 90
      - name: 报告落 Issue（仅定时/手动触发）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="📦 vendored 技能升级待办（自动检查）"
          BODY="@Oatelauser UTC $(date -u +%F\ %H:%M) 检查结果：
          \`\`\`
          $(cat report.txt)
          \`\`\`
          本地克隆慢/失败时用离线通道：[点此打开本运行的 Artifacts 下载页](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})（页面底部 Artifacts 区）下载 vendored-bundle-${{ github.run_number }}（zip，含 manifest.json），解压后执行 node scripts/update-vendored.mjs --diff --offline <解压目录> 评估、--upgrade --offline <解压目录> 应用（零克隆）。在线五步（check → diff → upgrade → 镜像 → 校验发版）见 README「如何升级这些技能」。"
          ISSUE=$(gh issue list --state open --search "in:title vendored 技能升级待办" --json number --jq '.[0].number')
          if [ "${{ steps.check.outputs.exit }}" = "1" ]; then
            if [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" --body "$BODY"
            else gh issue create --title "$TITLE" --body "$BODY"; fi
            echo "已报告可升级项 → Issue #$ISSUE"
          elif [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "@Oatelauser 本轮无升级项（UTC $(date -u +%F)），关闭。"
            echo "全绿，已关闭 Issue #$ISSUE"
          else
            echo "全绿且无未决 Issue，不动作。"
          fi
