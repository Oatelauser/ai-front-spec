name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 25]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --test scripts/lib/*.test.mjs
        shell: bash
      - run: node scripts/build-starter.mjs --check
        shell: bash
      - run: node .toolkit/scripts/check-ai-guidance.mjs --root . --strict
        shell: bash
      - run: node .toolkit/scripts/sync-mirror.mjs --check
        shell: bash

  release-policy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 发布策略暂停
        run: |
          echo 'release-policy: publication paused pending distribution-policy clearance'
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, release-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 断言 tag 与 toolkit.json version 一致
        run: |
          VERSION=$(node -p "require('./toolkit.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 与 toolkit.json version $VERSION 不一致" >&2
            exit 1
          fi
      - name: 干净副本（含三连校验）
        run: node scripts/build-starter.mjs --target "$RUNNER_TEMP/dist-starter"
      - name: 打包 release zip
        run: |
          VERSION=$(node -p "require('./toolkit.json').version")
          cd "$RUNNER_TEMP/dist-starter" && zip -r "$RUNNER_TEMP/ai-front-spec-v$VERSION.zip" .
      - name: 发布 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./toolkit.json').version")
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/ai-front-spec-v$VERSION.zip" --generate-notes
